<title>Phrase Mystère</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Mise en page : feuille blanche, titre au feutre, grille de 31 colonnes x 6 lignes de barres lavande, rangée de 27 cases de saisie dessous */
:root{
  --bg:#ffffff; --paper:#fbfaff; --ink:#15121c; --violet:#7a5fc0; --bar:#ddd6ef; --bar-line:#c9bfe6;
  --input:#fbe3df; --input-line:#2a2230; --accent:#c8102e; --muted:#6a6180; --btn:#ffffff; --warn-bg:#fff4d6; --warn-line:#e0b341;
  --marker:"Permanent Marker","Marker Felt","Chalkboard SE","Comic Sans MS",sans-serif; --body:"Nunito",system-ui,sans-serif;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--body);padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1100px;margin:0 auto;display:grid;gap:18px}
h1{font:400 clamp(34px,7vw,60px)/1.05 var(--marker);text-align:center;margin:0;text-wrap:balance}
h1 span{color:var(--violet);text-decoration:underline double var(--violet);text-underline-offset:.14em;text-decoration-thickness:2px}
.lead{margin:0;text-align:center;color:var(--muted);font-size:15px;text-wrap:balance}
.panel{background:var(--paper);border:2px solid var(--bar-line);border-radius:10px;padding:clamp(8px,2vw,22px)}
.wrap{container-type:inline-size}
.grid{display:grid;grid-template-columns:repeat(31,1fr);gap:clamp(1px,.3cqw,3px)}
.c{aspect-ratio:1/1.25;display:grid;place-items:center;border-radius:3px;font:400 calc(100cqw/31*.78)/1 var(--marker);color:transparent;user-select:none}
.slots .c.l{background:var(--bar);transition:background .6s}
.slots.done .c.l{background:transparent}
.panel{transition:background .6s,border-color .6s}
.panel.done{background:var(--bg);border-color:transparent}
.c.p{color:var(--ink);font-size:calc(100cqw/31*.9)}
.c.l.on{color:var(--ink);animation:pop .35s ease-out}
.c.l.on.fresh{color:var(--accent);animation:pop .35s ease-out,tint 1.4s ease-in .5s forwards}
@keyframes tint{to{color:var(--ink)}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.entry{display:grid;gap:12px}
.entry label.t{font:800 14px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center}
.boxes{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.boxes input{width:clamp(28px,calc((100vw - 32px)/14 - 4px),44px);aspect-ratio:3/4;text-align:center;font:400 22px var(--marker);
  text-transform:uppercase;background:var(--input);color:var(--ink);border:2px solid var(--input-line);border-radius:4px;padding:0;caret-color:transparent}
.boxes input:focus-visible{outline:3px solid var(--violet);outline-offset:1px}
.boxes input.dup{animation:shake .4s;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.msg{min-height:44px;display:flex;justify-content:center}
.msg p{margin:0;padding:9px 14px;background:var(--warn-bg);border:1.5px solid var(--warn-line);border-radius:8px;font-weight:700;font-size:15px;text-align:center}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:center;align-items:center}
button{font:700 15px var(--body);background:var(--btn);color:var(--ink);border:2px solid var(--input-line);border-radius:6px;padding:8px 14px;cursor:pointer}
button:focus-visible,.chk input:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.chk{display:flex;gap:8px;align-items:center;font-size:15px}
.count{font-weight:800;font-variant-numeric:tabular-nums}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
@media (prefers-reduced-motion:reduce){.c.l.on,.c.l.on.fresh,.boxes input.dup{animation:none}.c.l.on.fresh{color:var(--ink)}}
button:disabled{opacity:.45;cursor:default}
</style>

<main>
  <h1>Phrase <span>MYSTÈRE</span></h1>
  <p class="lead">Saisissez une lettre par case rose. Chaque lettre trouvée apparaît partout où elle se trouve dans la phrase.</p>
  <noscript><div class="msg"><p>Cette page a besoin de JavaScript. Ouvrez le lien dans Safari ou dans l'application Claude, pas depuis l'aperçu du fichier.</p></div></noscript>
  <div class="panel wrap"><div class="grid slots" id="grid" aria-live="polite"></div></div>
  <div class="entry">
    <label class="t" for="b0">Lettres proposées</label>
    <div class="boxes" id="boxes"></div>
    <div class="msg" id="msg" role="status" aria-live="assertive"></div>
    <div class="bar">
      <span class="count" id="count"></span>
      <button type="button" id="clear">Effacer les lettres</button>
      <button type="button" id="all" aria-pressed="false">Révéler la phrase</button>
      <button type="button" id="hint">Indice</button>
      <label class="chk"><input type="checkbox" id="slots" checked> Afficher les cases vides</label>
    </div>
  </div>
</main>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
// Lignes comme sur la carte. Les lettres entre crochets sont déjà visibles au départ.
const LINES = [
  "  [L]A [C]ROIX-ROUG[E] FRANÇAIS[E]",
  "[A]GIT POUR [P]ROTÉGER ET R[E]LEVER",
  "SANS [C]ONDITION LES [P]ERSONNES EN",
  "[S]ITUATION DE [V]ULN[É]RABILITÉ ET",
  "[C]ONSTRUIRE, [A]VEC [E]LLES, LEUR",
  "         [R]ÉSILIENCE."
];
const COLS = 31;
const ROWS = LINES.map(l => {
  const out = []; let pre = false;
  for (const ch of l) {
    if (ch === '[') { pre = true; continue; }
    if (ch === ']') { pre = false; continue; }
    out.push({ch, pre});
  }
  while (out.length < COLS) out.push({ch: ' ', pre: false});
  return out;
});
const N_BOX = 27;
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z]/g,'');
const grid = document.getElementById('grid'), boxesEl = document.getElementById('boxes'), msgEl = document.getElementById('msg');
const cells = [];
ROWS.forEach(r => r.forEach(({ch, pre}) => {
  const el = document.createElement('div');
  const key = norm(ch);
  el.className = 'c ' + (ch === ' ' ? 'e' : key ? 'l' : 'p');
  if (ch !== ' ') el.textContent = ch;
  if (key) cells.push({el, key, pre});
  grid.appendChild(el);
}));
const inputs = [];
let msgTimer;
function say(text) {
  clearTimeout(msgTimer);
  msgEl.replaceChildren();
  if (!text) return;
  const p = document.createElement('p'); p.textContent = text; msgEl.appendChild(p);
  msgTimer = setTimeout(() => msgEl.replaceChildren(), 3500);
}
function flash(letter) {
  const other = inputs.find(i => i.value === letter);
  if (!other) return;
  other.classList.remove('dup'); void other.offsetWidth; other.classList.add('dup');
  setTimeout(() => other.classList.remove('dup'), 1200);
}
function dupMessage(letters) {
  const u = [...new Set(letters)];
  say(u.length === 1 ? 'La lettre ' + u[0] + ' a déjà été proposée. Choisissez-en une autre.'
                     : 'Les lettres ' + u.join(', ') + ' ont déjà été proposées.');
}
for (let i = 0; i < N_BOX; i++) {
  const inp = document.createElement('input');
  inp.id = 'b' + i; inp.maxLength = 2; inp.autocomplete = 'off'; inp.autocapitalize = 'characters';
  inp.setAttribute('aria-label', 'Lettre ' + (i + 1));
  inp.addEventListener('focus', () => inp.select());
  inp.addEventListener('input', () => {
    const t = norm(inp.value).slice(-1);
    if (!t) { inp.value = ''; update(); return; }
    if (inputs.some((o, k) => k !== i && o.value === t)) {
      inp.value = ''; flash(t); dupMessage([t]); update(); return;
    }
    inp.value = t; say('');
    inputs[Math.min(i + 1, N_BOX - 1)].focus();
    update(t);
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !inp.value && i > 0) { inputs[i - 1].focus(); inputs[i - 1].value = ''; update(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' && i > 0) inputs[i - 1].focus();
    else if (e.key === 'ArrowRight' && i < N_BOX - 1) inputs[i + 1].focus();
  });
  inp.addEventListener('paste', e => {
    e.preventDefault();
    const t = norm((e.clipboardData || window.clipboardData).getData('text'));
    let pos = i; const dups = [];
    for (const c of t) {
      if (inputs.some((o, k) => k !== pos && o.value === c)) { dups.push(c); continue; }
      if (pos >= N_BOX) break;
      inputs[pos++].value = c;
    }
    inputs[Math.min(pos, N_BOX - 1)].focus();
    dups.length ? dupMessage(dups) : say('');
    update();
  });
  inputs.push(inp); boxesEl.appendChild(inp);
}
let showAll = false, celebrated = false;
const fx = document.getElementById('fx'), fctx = fx.getContext('2d');
const COLORS = ['#7a5fc0', '#c8102e', '#f2b705', '#1aa39a', '#ef6f9b', '#3b7de0'];
function fireworks() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  fx.width = W * dpr; fx.height = H * dpr; fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const parts = []; const t0 = performance.now(); let lastBurst = -1000;
  function burst() {
    const x = W * (.15 + Math.random() * .7), y = H * (.12 + Math.random() * .4), col = '#e1001a';
    for (let k = 0; k < 46; k++) {
      const a = Math.PI * 2 * k / 46 + Math.random() * .2, v = 1.5 + Math.random() * 3.2;
      parts.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, col});
    }
  }
  (function frame(now) {
    const t = now - t0;
    if (t < 3600 && now - lastBurst > 420) { burst(); lastBurst = now; }
    fctx.clearRect(0, 0, W, H);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.vy += .045; p.vx *= .985; p.life -= .014;
      if (p.life > 0) { fctx.globalAlpha = p.life; fctx.fillStyle = p.col; const s = 9, w = s / 3; fctx.fillRect(p.x - s / 2, p.y - w / 2, s, w); fctx.fillRect(p.x - w / 2, p.y - s / 2, w, s); }
    }
    fctx.globalAlpha = 1;
    for (let k = parts.length - 1; k >= 0; k--) if (parts[k].life <= 0) parts.splice(k, 1);
    if (t < 3600 || parts.length) requestAnimationFrame(frame); else fctx.clearRect(0, 0, W, H);
  })(t0);
}
function update(fresh) {
  const found = new Set(inputs.map(i => i.value).filter(Boolean));
  let n = 0;
  cells.forEach(c => {
    const on = showAll || c.pre || found.has(c.key);
    if (on) n++;
    c.el.classList.toggle('on', on);
    c.el.classList.toggle('fresh', !!fresh && c.key === fresh && !showAll);
  });
  document.getElementById('count').textContent = n + ' / ' + cells.length + ' lettres affichées';
  grid.classList.toggle('done', n === cells.length);
  grid.parentElement.classList.toggle('done', n === cells.length);
  hintBtn.disabled = showAll || n === cells.length;
  if (n === cells.length) cells.forEach(c => c.el.classList.remove('fresh'));
  const complete = cells.every(c => c.pre || found.has(c.key));
  if (complete && !celebrated) { celebrated = true; say('Bravo, la phrase est complète !'); fireworks(); }
  else if (!complete) celebrated = false;
}
const allBtn = document.getElementById('all');
const hintBtn = document.getElementById('hint');
hintBtn.onclick = () => {
  const left = [...new Set(cells.filter(c => !c.el.classList.contains('on')).map(c => c.key))];
  const empty = inputs.find(i => !i.value);
  if (!left.length || !empty) return;
  const l = left[Math.floor(Math.random() * left.length)];
  empty.value = l;
  say('Indice : la lettre ' + l + ' est dans la phrase.');
  update(l);
};
document.getElementById('clear').onclick = () => {
  inputs.forEach(i => i.value = ''); showAll = false;
  allBtn.setAttribute('aria-pressed', 'false'); allBtn.textContent = 'Révéler la phrase';
  say(''); update(); inputs[0].focus();
};
allBtn.onclick = () => {
  showAll = !showAll; allBtn.setAttribute('aria-pressed', showAll);
  allBtn.textContent = showAll ? 'Masquer la phrase' : 'Révéler la phrase'; update();
};
document.getElementById('slots').onchange = e => grid.classList.toggle('slots', e.target.checked);
update();
</script>
